name: Deploy Portfolio to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 185.166.39.5
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /docker/ayad-portfolio/app
            git pull origin main
            cd /docker/ayad-portfolio
            docker compose down
            docker compose build --no-cache
            docker compose up -d
